// 전투 XR의 원본 바다 PNG: 같은 원본을 한 번만 적용, 반복 타일 금지
const SEA='https://imm-content.github.io/admiral-yi-battle-xr/uldolmok-sea-texture.png';
const lessons=[
['제1막 · 희망의 열두 척','今臣戰船 尙有十二','금신전선 상유십이','지금 신에게는 아직 전선 열두 척이 있습니다.','今(이제 금) · 臣(신하 신) · 戰(싸울 전) · 船(배 선) · 尙(오히려 상) · 有(있을 유) · 十(열 십) · 二(두 이)','「十二」의 뜻은?',['열둘','스물','둘'],0],
['제2막 · 죽을힘을 다하여','出死力 拒戰則猶可爲也','출사력 거전즉유가위야','죽을힘을 다해 막아 싸운다면 아직 해볼 만합니다.','出(낼 출) · 死(죽을 사) · 力(힘 력) · 拒(막을 거) · 戰(싸울 전) · 則(곧 즉) · 猶(오히려 유) · 可(가할 가) · 爲(할 위) · 也(어조사 야)','「死力」의 뜻은?',['죽을힘','물살','군함'],0],
['제3막 · 필사즉생','必死則生 必生則死','필사즉생 필생즉사','죽기를 각오하면 살고, 살려고만 하면 죽는다.','必(반드시 필) · 死(죽을 사) · 則(곧 즉) · 生(살 생)','「生」의 뜻은?',['싸우다','살다','바다'],1],
['제4막 · 울돌목의 좁은 해협','一夫當逕 足懼千夫','일부당경 족구천부','한 사람이 좁은 길목을 지키면 천 사람도 두렵게 할 수 있다.','一(한 일) · 夫(사내 부) · 當(당할 당) · 逕(좁은 길 경) · 足(족할 족) · 懼(두려워할 구) · 千(일천 천)','「千夫」의 뜻은?',['백 사람','천 사람','열 사람'],1],
['제5막 · 승리의 명량','鳴梁海戰','명량해전','명량에서 벌어진 해전','鳴(울 명) · 梁(들보 량) · 海(바다 해) · 戰(싸울 전)','「海戰」의 뜻은?',['바다의 전투','산의 전투','배 건조'],0]];
const renderer=new THREE.WebGLRenderer({canvas:$('three'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xc2d6e0);
const camera=new THREE.PerspectiveCamera(50,1,.01,100);camera.position.set(0,3.0,6.2);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.minDistance=1.5;orbit.maxDistance=12;orbit.maxPolarAngle=Math.PI*.48;orbit.target.set(0,0,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x507187,2.5));const sun=new THREE.DirectionalLight(0xfff6df,2.3);sun.position.set(2,7,4);scene.add(sun);
const world=new THREE.Group();scene.add(world);
const seaGeo=new THREE.PlaneGeometry(8,8,220,220);seaGeo.rotateX(-Math.PI/2);
const seaTexture=new THREE.TextureLoader().load(SEA,()=>{$('loadStatus').textContent+=' · 원본 울돌목 바다 질감 적용 완료';},undefined,e=>{console.error('바다 텍스처:',e);$('loadStatus').textContent+=' · 바다 PNG 로드 실패: URL 확인 필요';});
seaTexture.colorSpace=THREE.SRGBColorSpace;seaTexture.wrapS=THREE.ClampToEdgeWrapping;seaTexture.wrapT=THREE.ClampToEdgeWrapping;seaTexture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
const seaMat=new THREE.MeshStandardMaterial({map:seaTexture,color:0xffffff,metalness:.08,roughness:.78,transparent:false,side:THREE.DoubleSide});
seaMat.onBeforeCompile=(shader)=>{
 shader.uniforms.uWaveTime={value:0};seaMat.userData.waveShader=shader;
 shader.vertexShader=shader.vertexShader.replace('#include <common>',`#include <common>
 uniform float uWaveTime;
 varying vec2 vSeaUV;
 varying float vWaveCrest;`);
 shader.vertexShader=shader.vertexShader.replace('#include <begin_vertex>',`#include <begin_vertex>
 vSeaUV=position.xz;
 float w1=sin(position.x*6.3+position.z*2.1+uWaveTime*1.45);
 float w2=sin(position.x*-3.4+position.z*8.1-uWaveTime*1.85);
 float w3=sin(position.x*13.7-position.z*10.8+uWaveTime*2.55);
 float w4=sin(position.x*22.5+position.z*17.1-uWaveTime*3.2);
 transformed.y+=.034*w1+.023*w2+.009*w3+.004*w4;
 vWaveCrest=.43*w1+.30*w2+.18*w3+.09*w4;`);
 shader.vertexShader=shader.vertexShader.replace('#include <beginnormal_vertex>',`#include <beginnormal_vertex>
 float dx=.034*6.3*cos(position.x*6.3+position.z*2.1+uWaveTime*1.45)
 +.023*(-3.4)*cos(position.x*-3.4+position.z*8.1-uWaveTime*1.85)
 +.009*13.7*cos(position.x*13.7-position.z*10.8+uWaveTime*2.55);
 float dz=.034*2.1*cos(position.x*6.3+position.z*2.1+uWaveTime*1.45)
 +.023*8.1*cos(position.x*-3.4+position.z*8.1-uWaveTime*1.85)
 -.009*10.8*cos(position.x*13.7-position.z*10.8+uWaveTime*2.55);
 objectNormal=normalize(vec3(-dx,1.0,-dz));`);
 shader.fragmentShader=shader.fragmentShader.replace('#include <common>',`#include <common>
 uniform float uWaveTime;
 varying vec2 vSeaUV;
 varying float vWaveCrest;`);
 shader.fragmentShader=shader.fragmentShader.replace('#include <color_fragment>',`#include <color_fragment>
 // 실제 울돌목 바다 이미지 질감을 보존하면서 파도의 능선에만 약한 포말을 더한다.
 float rip1=sin(vSeaUV.x*33.7+vSeaUV.y*21.9+uWaveTime*2.3);
 float rip2=sin(vSeaUV.x*-41.1+vSeaUV.y*35.3-uWaveTime*3.1);
 float foam=smoothstep(.63,.96,vWaveCrest+.035*rip1+.028*rip2);
 diffuseColor.rgb=mix(diffuseColor.rgb,vec3(.79,.90,.91),foam*.20);
 diffuseColor.rgb*=.96+.045*sin(uWaveTime*.48+vSeaUV.x*2.1+vSeaUV.y*1.7);`);
};

const sea=new THREE.Mesh(seaGeo,seaMat);sea.position.y=-.015;world.add(sea);
// 원본 바다 이미지 자체에 사실적인 좌우 섬이 들어 있습니다.
// 별도 low-poly 섬을 덧씌우지 않고, 4막에서는 카메라로 좁은 물길을 강조합니다.
let current=0,serial=0,shipSource=null,admiralSource=null,shipReady=false,admiralReady=false;
const fleet=new THREE.Group();world.add(fleet);
const vessels=[];let actor=null,leader=null,playing=false,leaderStart=0;
const loader=new GLTFLoader();
const tmpBox=new THREE.Box3(), tmpSize=new THREE.Vector3(), tmpCenter=new THREE.Vector3();
// 원본 admiral-yi-battle-xr의 성공한 정규화 방식: 원본 GLB 최대축 1.45 기준.
// 복제본을 원본과 동일하게 정규화한 후, 각 함선의 목표 길이만큼 추가 축소한다.
function normalized(source,targetLength,person=false){
 const holder=new THREE.Group();
 const model=source.clone(true);
 holder.add(model);
 holder.updateMatrixWorld(true);
 const initial=new THREE.Box3().setFromObject(model,true);
 const initialSize=initial.getSize(new THREE.Vector3());
 const initialCenter=initial.getCenter(new THREE.Vector3());
 const originalMax=Math.max(initialSize.x,initialSize.y,initialSize.z);
 if(!Number.isFinite(originalMax)||originalMax<1e-7)throw Error('GLB 경계 크기 오류');
 // 성공한 원본 코드와 동일한 1.45 기준으로 1차 축소.
 const k=1.45/originalMax;
 model.scale.multiplyScalar(k);
 model.position.sub(initialCenter.multiplyScalar(k));
 holder.updateMatrixWorld(true);
 // 모델의 실제 변환 이후 크기를 재측정하고 두 번째로 목표 크기를 적용.
 let bounds=new THREE.Box3().setFromObject(holder,true);
 let dimensions=bounds.getSize(new THREE.Vector3());
 const extent=person?dimensions.y:Math.max(dimensions.x,dimensions.z);
 if(!Number.isFinite(extent)||extent<1e-7)throw Error('정규화 후 모델 크기 오류');
 holder.scale.setScalar(targetLength/extent);
 holder.updateMatrixWorld(true);
 // 회전 전 모델을 바닥 중심에 놓는다. 좌표는 holder의 로컬 단위로 변환.
 bounds.setFromObject(holder,true);
 const center=bounds.getCenter(new THREE.Vector3());
 model.position.x-=center.x/holder.scale.x;
 model.position.z-=center.z/holder.scale.z;
 model.position.y-=bounds.min.y/holder.scale.y;
 holder.updateMatrixWorld(true);
 // 수평 장축이 X일 때만 함선 전체를 회전.
 if(!person&&initialSize.x>initialSize.z)holder.rotation.y=Math.PI/2;
 holder.updateMatrixWorld(true);
 return holder;
}
function shipAnchor(x,z,length=.44){
 const root=new THREE.Group();root.position.set(x,0,z);
 const hull=normalized(shipSource,length);root.add(hull);
 fleet.add(root);vessels.push(root);
 // 화면에 1척이 꽉 차는 오류를 즉시 알아볼 수 있도록 실제 크기를 출력.
 root.updateMatrixWorld(true);
 const actual=new THREE.Box3().setFromObject(root,true).getSize(new THREE.Vector3());
 console.info('판옥선 '+vessels.length+' 실제 크기:',actual.toArray(),'목표 길이:',length);
 return root;
}
function clearFleet(){while(fleet.children.length)fleet.remove(fleet.children[0]);vessels.length=0;actor=null;leader=null;playing=false;$('counter').textContent='판옥선 0 / 12척';}
function attachAdmiral(root){
 if(!admiralSource){$('loadStatus').textContent='장군 GLB 로딩 중입니다.';return;}
 // 장군은 기함의 자식 객체: 갑판 위에서 배와 함께 움직입니다.
 const hull=root.children[0];root.updateMatrixWorld(true);
 const box=new THREE.Box3().setFromObject(hull),sz=box.getSize(new THREE.Vector3());
 // 중앙 갑판 위의 적절한 위치를 찾기 위해 선체 상부로부터 레이캐스팅
 const px=0,pz=.02;
 const ray=new THREE.Raycaster(new THREE.Vector3(px,box.max.y+.5,pz),new THREE.Vector3(0,-1,0));
 const hits=ray.intersectObject(hull,true);
 const deck=hits.find(h=>h.point.y>box.min.y+sz.y*.18 && h.point.y<box.max.y-sz.y*.08);
 const y=deck?deck.point.y:box.min.y+sz.y*.56;
 actor=normalized(admiralSource,.20,true);
 const localDeck=root.worldToLocal(new THREE.Vector3(px,y+.006,pz));
 actor.position.copy(localDeck);
 actor.rotation.y=Math.PI; // 기본 방향은 선수 방향, 필요하면 방향 버튼으로 전환
 root.add(actor);
 $('loadStatus').textContent='장군을 대장선 갑판 위에 배치했습니다.';
}
loader.load(MODEL,g=>{shipSource=g.scene;shipReady=true;console.info('원본 판옥선 크기',new THREE.Box3().setFromObject(shipSource,true).getSize(new THREE.Vector3()));$('loadStatus').textContent='판옥선 GLB 준비 완료. 체험 시작을 누르세요.';},undefined,e=>{console.error(e);$('loadStatus').textContent='판옥선 GLB 로딩 실패. F12 Console 확인';});
loader.load(ADMIRAL,g=>{admiralSource=g.scene;admiralReady=true;if((current===1||current===2)&&leader&&!actor)attachAdmiral(leader);},undefined,e=>{console.error(e);$('loadStatus').textContent+=' · 장군 GLB 로딩 실패';});
function sceneCamera(){
 // 함대 전체가 보이는 1막, 기함과 장군을 강조하는 2·3막, 실사 해협을 강조하는 4막
 const positions=[ [0,4.2,7.0],[0,2.7,5.0],[0,1.25,2.1],[0,1.05,2.5],[0,2.7,4.7] ];
 const targets=[ [0,0,-.3],[0,.12,-.15],[0,.17,0],[0,0,-1.8],[0,0,-.2] ];
 camera.position.set(...positions[current]);orbit.target.set(...targets[current]);
 orbit.minDistance=2.4;orbit.maxDistance=18;orbit.update();
}
function renderLesson(){const s=lessons[current];$('sceneTitle').textContent=s[0];$('hanja').textContent=s[1];$('reading').textContent=s[2];$('meaning').textContent=s[3];$('explain').textContent=s[4];$('question').textContent=s[5];$('choices').replaceChildren();$('result').textContent='';s[6].forEach((v,i)=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>$('result').textContent=i===s[7]?'정답입니다!':'다시 생각해 보세요.';$('choices').append(b)});
 $('nav').replaceChildren();lessons.forEach((l,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'막';if(i===current)b.className='active';b.onclick=()=>{current=i;reset()};$('nav').append(b)});
 $('counter').style.display=current===0?'block':'none';
}
function reset(){serial++;clearFleet();renderLesson();sceneCamera();$('subtitle').textContent='▶ 체험 시작을 누르세요.';}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
async function play(){const id=++serial;clearFleet();playing=true;
 if(!shipReady&&current!==3){$('subtitle').textContent='판옥선 GLB 로딩 중입니다. 잠시 기다려 주세요.';return;}
 if(current===3){
  // 사진 속 섬을 그대로 유지하고 수면 중앙을 향해 카메라를 낮춰 물길 강조
  $('subtitle').textContent='울돌목의 좁은 물길과 거센 조류 — 양쪽 섬 사이를 관찰하세요.';
  return;
 }
 if(current===0){
  // 12척 모두 화면에 들어오는 3열 x 4행 편대, 길이 0.44m로 제한
  for(let i=0;i<12;i++){
   if(id!==serial)return;
   const row=Math.floor(i/3),col=i%3;
   const x=(col-1)*.78,z=-1.6+row*.79;
   shipAnchor(x,z,.44);
   $('counter').textContent='판옥선 '+vessels.length+' / 12척';
   await wait(200);
  }
  $('subtitle').textContent='12척의 판옥선이 바다 위에 진형을 이루었습니다.';
 }else if(current===1){
  // 후방 11척, 전방에는 장군이 탄 대장선 한 척
  for(let i=0;i<11;i++){
   const row=Math.floor(i/4),col=i%4;
   shipAnchor((col-1.5)*.63,-1.65+row*.63,.36);
  }
  leader=shipAnchor(0,1.05,.62);attachAdmiral(leader);leaderStart=performance.now()/1000;
  $('subtitle').textContent='대장선이 앞서 나갑니다. 出死力 拒戰則猶可爲也!';
  speak();
 }else if(current===2){
  leader=shipAnchor(0,0,.85);attachAdmiral(leader);
  $('subtitle').textContent='대장선 갑판 위 이순신 장군 — 必死則生 必生則死!';
  speak();
 }else{
  for(let i=0;i<12;i++){const row=Math.floor(i/3),col=i%3;shipAnchor((col-1)*.76,-1.4+row*.75,.42);}
  $('subtitle').textContent='명량해전의 승리 — 조선 수군의 함대가 돌아옵니다.';
 }
}
function speak(){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const s=lessons[current],u=new SpeechSynthesisUtterance(s[2]+'. '+s[3]);u.lang='ko-KR';u.rate=.82;window.speechSynthesis.speak(u)}
