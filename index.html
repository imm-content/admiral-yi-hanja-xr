function narration(n){speechSynthesis?.cancel();const d=scenes[n];if(n===4){const lines=['명량해전. 1597년 음력 9월, 이순신이 이끄는 조선 수군은 명량해협에서 일본 수군과 맞섰습니다.','조선 수군은 좁은 물길과 빠른 조류, 판옥선의 화포를 활용하여 수적으로 우세한 일본 수군에 맞섰습니다.','전투가 치열하게 이어졌지만 조선 수군은 끝내 적의 진격을 막아냈습니다. 명량해전은 어려운 상황에서도 지휘와 용기로 싸운 역사로 기억됩니다.'];lines.forEach(t=>speakText(t,.82))}else{speakText(d.reading,.77);speakText(d.meaning,.86)}}
function caption(n){narration(n)}
function initAudio(){try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch(e){console.warn(e)}}
function boom(){if(!audioCtx)return;const now=audioCtx.currentTime;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(95,now);o.frequency.exponentialRampToValueAtTime(36,now+.45);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.33,now+.015);g.gain.exponentialRampToValueAtTime(.0001,now+.8);o.connect(g).connect(audioCtx.destination);o.start(now);o.stop(now+.81);const length=Math.floor(audioCtx.sampleRate*.65),buffer=audioCtx.createBuffer(1,length,audioCtx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<length;i++)data[i]=Math.random()*2-1;const src=audioCtx.createBufferSource(),filter=audioCtx.createBiquadFilter(),gain=audioCtx.createGain();src.buffer=buffer;filter.type='lowpass';filter.frequency.value=700;gain.gain.setValueAtTime(.22,now);gain.gain.exponentialRampToValueAtTime(.0001,now+.65);src.connect(filter).connect(gain).connect(audioCtx.destination);src.start(now);src.stop(now+.65)}
function spray(){const geo=new THREE.SphereGeometry(.035,6,5),mat=new THREE.MeshBasicMaterial({color:0xd7edf1,transparent:true,opacity:.75});for(let i=0;i<10;i++){const m=new THREE.Mesh(geo,mat.clone());m.position.set((Math.random()-.5)*5,.05,Math.random()*3-1.5);world.add(m);bursts.push(m);setTimeout(()=>{world.remove(m);m.geometry.dispose();m.material.dispose();const j=bursts.indexOf(m);if(j>=0)bursts.splice(j,1)},700)}}
function play(){
 if(!ready){statusMsg('첫 번째 판옥선 로딩 중입니다. 잠시 기다려 주세요.');return}
 run++;window.speechSynthesis?.cancel();act=current+1;act1Spoken=false;activeTime=performance.now()/1000;
 ships.forEach((s,i)=>{if(!s)return;s.visible=act===1?i===0:act===2||act===3;s.position.set(coords[i][0],0,coords[i][1]);s.rotation.set(0,0,0)});
 if(admiral3D)admiral3D.visible=false;
 if(enemyShip)enemyShip.visible=false;
 islandGroup.visible=act===4;clearShots();
 $('count').style.display=act===1?'block':'none';$('count').textContent='조선 수군 1 / 12척';
 resetCamera();initAudio();sea.scale.y=1;enemySinking=false;enemySinkStart=0;lastFire=0;
 if(act===1){statusMsg('판옥선이 한 척씩 나타납니다.');return}
 if(act===2||act===3){
  // 대장선은 화면 정중앙 선두로 이동하고 장군 GLB는 선수에 서 있습니다.
  ships[0].position.set(0,0,-1.35);
  if(admiral3D){admiral3D.position.set(0,.12,-1.05);admiral3D.visible=true;}
  statusMsg(admiral3D?'대장선 선두 이동 · 이순신 장군의 결의':'장군 GLB를 불러오는 중입니다.');
  const token=run;setTimeout(()=>{if(token===run)caption(current)},1500);return;
 }
 if(act===4){
  ships.forEach(s=>{if(s)s.visible=false});
  // 배 없이 실제 3D 바다와 양쪽 섬만 보여줍니다. 도형 오버레이는 사용하지 않습니다.
  camera.position.set(0,1.5,3.6);orbit.target.set(0,.0,-.7);orbit.update();
  statusMsg('울돌목의 좁은 해협 · 높아진 파도와 양쪽 섬');
  const token=run;setTimeout(()=>{if(token===run)caption(3)},1500);return;
 }
 if(act===5){
  ships.forEach(s=>{if(s)s.visible=false});ships[0].visible=true;ships[0].position.set(-.85,0,.55);
  if(enemyShip){enemyShip.visible=true;enemyShip.position.set(.85,0,-1.3);enemyShip.rotation.set(0,Math.PI,0);}else{statusMsg('일본군 함선 로딩 중 · 완료되면 등장합니다.');}
  statusMsg(enemyLoaded?'명량해전 · 포격과 일본군 함선 침몰':'명량해전 · 일본군 GLB 로딩 여부 확인 필요');
  narration(4);return;
 }
}
$('play').onclick=play;$('speak').onclick=()=>{speechSynthesis?.cancel();narration(current)};$('prev').onclick=()=>choose((current+4)%5);$('next').onclick=()=>choose((current+1)%5);
function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
let lastFire=0,enemySinking=false,enemySinkStart=0;
function fireCannon(t){
 if(!enemyShip||!enemyShip.visible||enemySinking)return;
 const start=ships[0].position.clone().add(new THREE.Vector3(.2,.25,-.12));
 const end=enemyShip.position.clone().add(new THREE.Vector3(0,.2,0));
 const mesh=new THREE.Mesh(cannonGeo,cannonMat);mesh.position.copy(start);shotGroup.add(mesh);
 shots.push({mesh,start,end,born:t,duration:.95});boom();
 $('view').classList.remove('shake');void $('view').offsetWidth;$('view').classList.add('shake');
}
renderer.setAnimationLoop(t=>{
 const time=t/1000;
 if(seaMat.userData.waveShader){seaMat.userData.waveShader.uniforms.uWaveTime.value=time;seaMat.userData.waveShader.uniforms.uWaveAmp.value=act===4?4.4:1.0;}
 if(act===1){
  const joined=Math.min(12,1+Math.floor(Math.max(0,time-activeTime)/.85));
  ships.forEach((s,i)=>{if(s)s.visible=i<joined});$('count').textContent='조선 수군 '+ships.slice(0,joined).filter(Boolean).length+' / 12척';
  if(joined===12&&fleetReady&&!act1Spoken){act1Spoken=true;caption(0);statusMsg('판옥선 12척 집결 완료')}
 }
 if(act===2||act===3){
  ships[0].position.z=Math.min(.35,-1.35+Math.max(0,time-activeTime)*.4);
  if(admiral3D&&admiral3D.visible&&ships[0])admiral3D.position.z=ships[0].position.z+.28;
 }
 if(act===4){
  const elapsed=Math.min(1,(time-activeTime)/3);
  islandGroup.children[0].position.x=1.0*elapsed;
  islandGroup.children[1].position.x=-1.0*elapsed;
  // 기존 바다의 폭은 유지하고, 4막에서만 파도 높이를 높입니다.
  if(seaMat.userData.waveShader)seaMat.userData.waveShader.uniforms.uWaveTime.value=time*1.8;
 }
 if(act===5){
  if(enemyShip&&enemyShip.visible&&!enemySinking&&time-activeTime>1.2&&time-lastFire>2.1){lastFire=time;fireCannon(time)}
  for(let i=shots.length-1;i>=0;i--){const o=shots[i],f=Math.min(1,(time-o.born)/o.duration);
   o.mesh.position.lerpVectors(o.start,o.end,f);o.mesh.position.y+=Math.sin(Math.PI*f)*.65;
   if(f>=1){shotGroup.remove(o.mesh);shots.splice(i,1);spray();if(!enemySinking){enemySinking=true;enemySinkStart=time;boom()}}
  }
  if(enemySinking&&enemyShip){const f=Math.min(1,(time-enemySinkStart)/5);
   enemyShip.position.y=-f*.95;enemyShip.rotation.z=f*1.1;
   if(f>=1){enemyShip.visible=false;statusMsg('일본군 함선 침몰 · 명량해전의 승리');}
  }
 }
 orbit.update();renderer.render(scene,camera)
});
choose(0);world.visible=true;loadFleet();
</script></body></html>
