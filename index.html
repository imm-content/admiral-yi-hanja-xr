<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이순신 한자학습 XR — 3D 판옥선 12척</title><style>
*{box-sizing:border-box}body{margin:0;background:#071725;color:#f4f0e6;font-family:system-ui,'Malgun Gothic',sans-serif}header,footer{text-align:center;padding:18px}h1{color:#f3ce85;margin:0;font-size:clamp(25px,4vw,40px)}header p,footer{color:#b9c9d2}.wrap{max-width:1150px;margin:auto;padding:10px}.nav,.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}button{background:#21485f;border:1px solid #7c9bab;color:#fff;border-radius:9px;padding:11px 15px;cursor:pointer;font-size:15px}button.active,button.primary{background:#94672e;border-color:#e2bb7b}.viewer{height:min(60vw,570px);min-height:350px;position:relative;background:#102e46;border:2px solid #a58d61;border-radius:15px;overflow:hidden}#three{width:100%;height:100%;display:block}.overlay{position:absolute;inset:0;pointer-events:none}.subtitle{position:absolute;bottom:12px;left:4%;right:4%;padding:10px;background:#061723c9;text-align:center;border-radius:8px;font-weight:bold}.counter{position:absolute;top:12px;left:12px;background:#051b2ac9;border-radius:7px;padding:8px}.lesson{padding:20px;text-align:center;background:#112d40;border-radius:12px}.hanja{font-size:clamp(30px,6vw,52px);font-family:serif;color:#f3ce85;margin:8px}.reading{font-size:20px}.meaning{font-size:18px;margin:10px}.explain{color:#b9c9d2}.quiz{padding:15px;border:1px solid #456277;border-radius:10px;margin-top:12px}.quiz button{margin:3px}.status{color:#f3ce85}.notice{font-size:13px;color:#c5d5dd;text-align:center;margin:8px}.shake{animation:shake .24s 3}@keyframes shake{25%{transform:translate(3px,2px)}50%{transform:translate(-3px,-2px)}75%{transform:translate(2px,-2px)}}@media(max-width:600px){.viewer{min-height:390px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><header><h1>⚓ 이순신 한자학습 XR</h1><p>3D 판옥선 열두 척 · 울돌목 바다 · 다섯 막의 한문 체험</p></header><main class="wrap"><nav class="nav" id="nav"></nav><div class="viewer" id="viewer"><canvas id="three"></canvas><div class="overlay"><div class="counter" id="counter">판옥선 0 / 12척</div><div class="subtitle" id="subtitle">체험 시작을 누르세요.</div></div></div><div class="controls"><button class="primary" id="play">▶ 체험 시작</button><button id="speak">🔊 음성 듣기</button><button id="reset">↺ 장면 초기화</button><button id="prev">← 이전 막</button><button id="next">다음 막 →</button></div><p class="notice" id="loadStatus">3D 모델 로딩 중입니다. GLB 로드가 완료된 뒤 체험을 시작하세요. 마우스로 회전·확대할 수 있습니다.</p><section class="lesson"><div id="sceneTitle"></div><div class="hanja" id="hanja"></div><div class="reading" id="reading"></div><div class="meaning" id="meaning"></div><div class="explain" id="explain"></div></section><section class="quiz"><b>한자 확인 문제</b><p id="question"></p><div id="choices"></div><p class="status" id="result"></p></section></main><footer>교육용 3D 시뮬레이션 · 실제 역사적 함대 배치 및 조류의 정밀 복원은 아닙니다.</footer>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id);
const MODEL='https://imm-content.github.io/admiral-yi-history-xr/Sketchfab_panokseon.glb';
const ADMIRAL='https://imm-content.github.io/admiral-yi-history-xr/admiral-yi-sunsin.glb';
// 전투 XR의 원본 바다 PNG: 같은 원본을 한 번만 적용, 반복 타일 금지
const SEA='https://imm-content.github.io/admiral-yi-battle-xr/uldolmok-sea-texture.png';
const lessons=[
['제1막 · 희망의 열두 척','今臣戰船 尙有十二','금신전선 상유십이','지금 신에게는 아직 전선 열두 척이 있습니다.','今(이제 금) · 臣(신하 신) · 戰(싸울 전) · 船(배 선) · 尙(오히려 상) · 有(있을 유) · 十(열 십) · 二(두 이)','「十二」의 뜻은?',['열둘','스물','둘'],0],
['제2막 · 죽을힘을 다하여','出死力 拒戰則猶可爲也','출사력 거전즉유가위야','죽을힘을 다해 막아 싸운다면 아직 해볼 만합니다.','出(낼 출) · 死(죽을 사) · 力(힘 력) · 拒(막을 거) · 戰(싸울 전) · 則(곧 즉) · 猶(오히려 유) · 可(가할 가) · 爲(할 위) · 也(어조사 야)','「死力」의 뜻은?',['죽을힘','물살','군함'],0],
['제3막 · 필사즉생','必死則生 必生則死','필사즉생 필생즉사','죽기를 각오하면 살고, 살려고만 하면 죽는다.','必(반드시 필) · 死(죽을 사) · 則(곧 즉) · 生(살 생)','「生」의 뜻은?',['싸우다','살다','바다'],1],
['제4막 · 울돌목의 좁은 해협','一夫當逕 足懼千夫','일부당경 족구천부','한 사람이 좁은 길목을 지키면 천 사람도 두렵게 할 수 있다.','一(한 일) · 夫(사내 부) · 當(당할 당) · 逕(좁은 길 경) · 足(족할 족) · 懼(두려워할 구) · 千(일천 천)','「千夫」의 뜻은?',['백 사람','천 사람','열 사람'],1],
['제5막 · 승리의 명량','鳴梁海戰','명량해전','명량에서 벌어진 해전','鳴(울 명) · 梁(들보 량) · 海(바다 해) · 戰(싸울 전)','「海戰」의 뜻은?',['바다의 전투','산의 전투','배 건조'],0]];
const renderer=new THREE.WebGLRenderer({canvas:$('three'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xc2d6e0);
const camera=new THREE.PerspectiveCamera(50,1,.01,100);camera.position.set(0,3.0,6.2);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.minDistance=1.5;orbit.maxDistance=12;orbit.maxPolarAngle=Math.PI*.48;orbit.target.set(0,0,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x507187,2.5));const sun=new THREE.DirectionalLight(0xfff6df,2.3);sun.position.set(2,7,4);scene.add(sun);
const world=new THREE.Group();scene.add(world);
const seaGeo=new THREE.PlaneGeometry(8,8,220,220);seaGeo.rotateX(-Math.PI/2);
const seaTexture=new THREE.TextureLoader().load(SEA,()=>{$('loadStatus').textContent+=' · 원본 울돌목 바다 질감 적용 완료';},undefined,e=>{console.error('바다 텍스처:',e);$('loadStatus').textContent+=' · 바다 PNG 로드 실패: URL 확인 필요';});
seaTexture.colorSpace=THREE.SRGBColorSpace;seaTexture.wrapS=THREE.ClampToEdgeWrapping;seaTexture.wrapT=THREE.ClampToEdgeWrapping;seaTexture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
const seaMat=new THREE.MeshStandardMaterial({map:seaTexture,color:0xffffff,metalness:.08,roughness:.78,transparent:false,side:THREE.DoubleSide});
seaMat.onBeforeCompile=(shader)=>{
 shader.uniforms.uWaveTime={value:0};seaMat.userData.waveShader=shader;
 shader.vertexShader=shader.vertexShader.replace('#include <common>',`#include <common>
 uniform float uWaveTime;
 varying vec2 vSeaUV;
 varying float vWaveCrest;`);
 shader.vertexShader=shader.vertexShader.replace('#include <begin_vertex>',`#include <begin_vertex>
 vSeaUV=position.xz;
 float w1=sin(position.x*6.3+position.z*2.1+uWaveTime*1.45);
 float w2=sin(position.x*-3.4+position.z*8.1-uWaveTime*1.85);
 float w3=sin(position.x*13.7-position.z*10.8+uWaveTime*2.55);
 float w4=sin(position.x*22.5+position.z*17.1-uWaveTime*3.2);
 transformed.y+=.034*w1+.023*w2+.009*w3+.004*w4;
 vWaveCrest=.43*w1+.30*w2+.18*w3+.09*w4;`);
 shader.vertexShader=shader.vertexShader.replace('#include <beginnormal_vertex>',`#include <beginnormal_vertex>
 float dx=.034*6.3*cos(position.x*6.3+position.z*2.1+uWaveTime*1.45)
 +.023*(-3.4)*cos(position.x*-3.4+position.z*8.1-uWaveTime*1.85)
 +.009*13.7*cos(position.x*13.7-position.z*10.8+uWaveTime*2.55);
 float dz=.034*2.1*cos(position.x*6.3+position.z*2.1+uWaveTime*1.45)
 +.023*8.1*cos(position.x*-3.4+position.z*8.1-uWaveTime*1.85)
 -.009*10.8*cos(position.x*13.7-position.z*10.8+uWaveTime*2.55);
 objectNormal=normalize(vec3(-dx,1.0,-dz));`);
 shader.fragmentShader=shader.fragmentShader.replace('#include <common>',`#include <common>
 uniform float uWaveTime;
 varying vec2 vSeaUV;
 varying float vWaveCrest;`);
 shader.fragmentShader=shader.fragmentShader.replace('#include <color_fragment>',`#include <color_fragment>
 // 실제 울돌목 바다 이미지 질감을 보존하면서 파도의 능선에만 약한 포말을 더한다.
 float rip1=sin(vSeaUV.x*33.7+vSeaUV.y*21.9+uWaveTime*2.3);
 float rip2=sin(vSeaUV.x*-41.1+vSeaUV.y*35.3-uWaveTime*3.1);
 float foam=smoothstep(.63,.96,vWaveCrest+.035*rip1+.028*rip2);
 diffuseColor.rgb=mix(diffuseColor.rgb,vec3(.79,.90,.91),foam*.20);
 diffuseColor.rgb*=.96+.045*sin(uWaveTime*.48+vSeaUV.x*2.1+vSeaUV.y*1.7);`);
};

const sea=new THREE.Mesh(seaGeo,seaMat);sea.position.y=-.015;world.add(sea);
// 섬은 수면 양옆의 입체 지형. 바다 사진을 다시 깔거나 바다 위에 덮지 않음.
const islands=new THREE.Group();world.add(islands);
const rockMats=[0x4b554b,0x69705b,0x827f68,0x384c3b].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:1,flatShading:true}));
function makeIsland(side){const group=new THREE.Group();group.position.x=0;islands.add(group);
 const n=48,r=9,verts=[],idx=[];
 for(let j=0;j<=r;j++)for(let i=0;i<=n;i++){
  const z=-4+i*8/n, f=j/r;
  const inner=side*(.70+.12*Math.sin(z*2.3)+.14*Math.cos(z*4.7));
  const x=inner+side*f*1.8;
  const height=-.10+Math.pow(f,.9)*(1.0+.23*Math.sin(z*2.7+side)+.15*Math.cos(z*6.2));
  verts.push(x,height,z);
 }
 for(let j=0;j<r;j++)for(let i=0;i<n;i++){const k=j*(n+1)+i;idx.push(k,k+1,k+n+1,k+1,k+n+2,k+n+1)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));g.setIndex(idx);g.computeVertexNormals();
 const mesh=new THREE.Mesh(g,rockMats[0]);mesh.material.side=THREE.DoubleSide;group.add(mesh);
 for(let k=0;k<100;k++){const z=-3.9+(k*1.6180339%1)*7.8, f=.24+(k*.75487766%1)*.73;
  const x=side*(.75+f*1.75+.1*Math.sin(z*2.3));const h=.15+f*.85+.16*Math.sin(z*2.7);
  const m=new THREE.Mesh(new THREE.DodecahedronGeometry(.065+(k%5)*.026,0),rockMats[k%4]);m.position.set(x,h,z);m.scale.set(1,.5+(k%3)*.25,1.3);group.add(m);
 }
}makeIsland(-1);makeIsland(1);islands.visible=false;
let current=0,serial=0,shipSource=null,admiralSource=null,shipReady=false,admiralReady=false;
const fleet=new THREE.Group();world.add(fleet);const vessels=[];let actor=null;
const loader=new GLTFLoader();
function normalized(src,length,character=false){const group=new THREE.Group(),object=src.clone(true);group.add(object);object.updateMatrixWorld(true);
 const box=new THREE.Box3().setFromObject(object),sz=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
 const horizontal=Math.max(sz.x,sz.z),measure=character?sz.y:horizontal;
 if(!Number.isFinite(measure)||measure<1e-6)throw Error('GLB 크기를 읽을 수 없습니다.');
 const factor=length/measure;object.scale.setScalar(factor);object.position.set(-center.x*factor,-box.min.y*factor,-center.z*factor);
 // 원본 배의 긴 축이 X이면 Z축으로 회전하여 동일한 항해 방향을 맞춤
 if(!character&&sz.x>sz.z)group.rotation.y=Math.PI/2;
 return group;
}
function shipAnchor(x,z){const root=new THREE.Group();root.position.set(x,0,z);const hull=normalized(shipSource,.72);root.add(hull);fleet.add(root);vessels.push(root);return root;}
function clearFleet(){while(fleet.children.length)fleet.remove(fleet.children[0]);vessels.length=0;actor=null;$('counter').textContent='판옥선 0 / 12척';}
function attachAdmiral(root){if(!admiralSource){$('subtitle').textContent='장군 GLB를 불러오는 중입니다.';return;}
 // 갑판 높이: 배 모델 실제 표면에 레이캐스트를 발사해 구함
 const boat=root.children[0];boat.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(boat);const center=b.getCenter(new THREE.Vector3());
 const ray=new THREE.Raycaster(new THREE.Vector3(center.x,b.max.y+.5,center.z),new THREE.Vector3(0,-1,0));
 const hits=ray.intersectObject(boat,true);const deck=hits.find(h=>h.point.y>b.min.y+(b.max.y-b.min.y)*.22);
 const h=deck?deck.point.y:b.min.y+(b.max.y-b.min.y)*.52;
 actor=normalized(admiralSource,.24,true);actor.position.set(0,h+.008,.04);
 // 배의 앞쪽(+Z)을 바라보게 함. 원본 장군 모델의 정면축은 필요 시 180도 보정 가능
 actor.rotation.y=Math.PI;root.add(actor);
}
loader.load(MODEL,g=>{shipSource=g.scene;shipReady=true;$('loadStatus').textContent='판옥선 GLB 준비 완료. 1막 체험 시작을 누르세요.';},undefined,e=>{$('loadStatus').textContent='판옥선 GLB 로딩 실패: F12 Console에서 URL/오류를 확인하세요.';console.error(e)});
loader.load(ADMIRAL,g=>{admiralSource=g.scene;admiralReady=true;if(current===2&&vessels.length&&!actor)attachAdmiral(vessels[0]);},undefined,e=>{console.error('장군 GLB:',e);$('loadStatus').textContent+=' · 장군 GLB 로드 실패';});
function sceneCamera(){const is4=current===3;camera.position.set(0,is4?2.1:current===2?1.45:3.0,is4?3.4:current===2?2.45:6.2);orbit.target.set(0,is4?.15:current===2?.17:0,is4?-.4:0);orbit.update();}
function renderLesson(){const s=lessons[current];$('sceneTitle').textContent=s[0];$('hanja').textContent=s[1];$('reading').textContent=s[2];$('meaning').textContent=s[3];$('explain').textContent=s[4];$('question').textContent=s[5];$('choices').replaceChildren();$('result').textContent='';s[6].forEach((v,i)=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>$('result').textContent=i===s[7]?'정답입니다!':'다시 생각해 보세요.';$('choices').append(b)});
 $('nav').replaceChildren();lessons.forEach((l,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'막';if(i===current)b.className='active';b.onclick=()=>{current=i;reset()};$('nav').append(b)});
 $('counter').style.display=current===0?'block':'none';islands.visible=current===3;seaMat.userData.rough=current===3;
}
function reset(){serial++;clearFleet();renderLesson();sceneCamera();$('subtitle').textContent='▶ 체험 시작을 누르세요.';}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
async function play(){const id=++serial;clearFleet();if(!shipReady){$('subtitle').textContent='판옥선 GLB 로딩 중입니다. 잠시 기다려 주세요.';return;}
 if(current===3){$('subtitle').textContent='좌우 섬 사이의 좁은 울돌목과 거센 물살을 살펴보세요.';return;}
 if(current===2){const root=shipAnchor(0,0);attachAdmiral(root);$('subtitle').textContent='장군이 판옥선 갑판에서 전방을 바라봅니다.';return;}
 const count=current===0?12:current===1?5:12;
 for(let i=0;i<count;i++){
  if(id!==serial)return;
  // 4열×3행: 실제 3D 개체 각각 독립 위치에 생성. 수면 전체 8m 안에 들어오도록 배치
  const row=Math.floor(i/4),col=i%4;
  const x=(col-1.5)*.91,z=(row-1)*1.20;
  const root=shipAnchor(x,z);root.userData.phase=i*.6;
  if(current===0)$('counter').textContent='판옥선 '+vessels.length+' / 12척';
  if(current===0&&i===0)await wait(900);
  await wait(current===0?240:130);
 }
 if(id!==serial)return;
 $('subtitle').textContent=current===0?'판옥선 12척이 모두 바다 위에 배치되었습니다.':lessons[current][3];
}
function speak(){if(!('speechSynthesis'in window))return alert('음성 지원 브라우저가 아닙니다.');speechSynthesis.cancel();const s=lessons[current],u=new SpeechSynthesisUtterance(s[2]+'. '+s[3]);u.lang='ko-KR';u.rate=.86;speechSynthesis.speak(u)}
$('play').onclick=play;$('speak').onclick=speak;$('reset').onclick=reset;$('prev').onclick=()=>{current=(current+4)%5;reset()};$('next').onclick=()=>{current=(current+1)%5;reset()};
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();
 if(seaMat.userData.waveShader)seaMat.userData.waveShader.uniforms.uWaveTime.value=t*(current===3?2.6:1.0);
 vessels.forEach((r,i)=>{r.position.y=.008*Math.sin(t*2.1+i*.7);r.rotation.z=.018*Math.sin(t*1.3+i);r.rotation.x=.013*Math.cos(t*1.4+i)});
 orbit.update();const box=$('viewer').getBoundingClientRect(),w=Math.max(1,Math.floor(box.width)),h=Math.max(1,Math.floor(box.height));if(renderer.domElement.width!==Math.floor(w*renderer.getPixelRatio())||renderer.domElement.height!==Math.floor(h*renderer.getPixelRatio())){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()};renderer.render(scene,camera);
}reset();animate();

</script></body></html>
