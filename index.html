</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script></head><body><header><h1>⚓ 이순신 한자학습 XR</h1><p>원본 명량해전 XR 바다 · 판옥선 열두 척 · 다섯 막 한문 체험</p></header><main class="wrap"><div class="nav" id="nav"></div><div class="viewer"><div id="view"></div><div class="overlay"><div id="counter" class="counter">판옥선 0 / 12척</div><div class="subtitle" id="subtitle">모델 로딩 중</div></div></div><div class="controls"><button id="play" class="primary">▶ 체험 시작</button><button id="speak">🔊 음성 듣기</button><button id="reset">↺ 장면 초기화</button><button id="prev">← 이전 막</button><button id="next">다음 막 →</button><button id="test1">진단: 1척</button><button id="test3">진단: 3척</button><button id="test12">진단: 12척</button></div><p class="notice" id="status">GLB와 바다 이미지를 불러오는 중입니다.</p><details><summary>3D 진단 정보</summary><pre id="diagnostics"></pre></details><section class="lesson"><div id="sceneTitle"></div><div id="hanja" class="hanja"></div><div id="reading"></div><p id="meaning"></p><small id="explain"></small></section><section class="quiz"><strong>한자 확인 문제</strong><p id="question"></p><div id="choices"></div><p id="result"></p></section></main><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const $=id=>document.getElementById(id),base='https://imm-content.github.io/admiral-yi-history-xr/';
const lessons=[
['제1막 · 희망의 열두 척','今臣戰船 尙有十二','금신전선 상유십이','지금 신에게는 아직 전선 열두 척이 있습니다.','今(이제 금) · 臣(신하 신) · 戰(싸울 전) · 船(배 선) · 尙(오히려 상) · 有(있을 유) · 十(열 십) · 二(두 이)','「十二」의 뜻은?',['열둘','스물','둘'],0],
['제2막 · 죽을힘을 다하여','出死力 拒戰則猶可爲也','출사력 거전즉유가위야','죽을힘을 다해 막아 싸운다면 아직 해볼 만합니다.','出(낼 출) · 死(죽을 사) · 力(힘 력) · 拒(막을 거) · 戰(싸울 전) · 則(곧 즉) · 猶(오히려 유) · 可(가할 가) · 爲(할 위) · 也(어조사 야)','「死力」의 뜻은?',['죽을힘','물살','군함'],0],
['제3막 · 필사즉생','必死則生 必生則死','필사즉생 필생즉사','죽기를 각오하면 살고, 살려고만 하면 죽는다.','必(반드시 필) · 死(죽을 사) · 則(곧 즉) · 生(살 생)','「生」의 뜻은?',['싸우다','살다','바다'],1],
['제4막 · 울돌목의 좁은 해협','一夫當逕 足懼千夫','일부당경 족구천부','한 사람이 좁은 길목을 지키면 천 사람도 두렵게 할 수 있다.','一(한 일) · 夫(사내 부) · 當(당할 당) · 逕(좁은 길 경) · 足(족할 족) · 懼(두려워할 구) · 千(일천 천)','「千夫」의 뜻은?',['백 사람','천 사람','열 사람'],1],
['제5막 · 승리의 명량','鳴梁海戰','명량해전','명량에서 벌어진 해전','鳴(울 명) · 梁(들보 량) · 海(바다 해) · 戰(싸울 전)','「海戰」의 뜻은?',['바다의 전투','산의 전투','배 건조'],0]];

const scene=new THREE.Scene();scene.background=new THREE.Color(0xc2d6e0);const camera=new THREE.PerspectiveCamera(50,1,.01,100);camera.position.set(0,3.8,7.7);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;$('view').appendChild(renderer.domElement);renderer.domElement.style.cssText='width:100%;height:100%;display:block';const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.target.set(0,0,-.5);orbit.update();scene.add(new THREE.HemisphereLight(0xffffff,0x507187,2.5));const sun=new THREE.DirectionalLight(0xfff6df,2.3);sun.position.set(2,7,4);scene.add(sun);
const world=new THREE.Group();scene.add(world);const seaGeo=new THREE.PlaneGeometry(8,8,220,220);seaGeo.rotateX(-Math.PI/2);const seaTexture=new THREE.TextureLoader().load('https://imm-content.github.io/admiral-yi-battle-xr/uldolmok-sea-texture.png',()=>log('바다 PNG 로딩 완료'),undefined,e=>log('바다 PNG 실패: '+e));seaTexture.colorSpace=THREE.SRGBColorSpace;seaTexture.wrapS=THREE.ClampToEdgeWrapping;seaTexture.wrapT=THREE.ClampToEdgeWrapping;seaTexture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());const seaMat=new THREE.MeshStandardMaterial({map:seaTexture,color:0xffffff,metalness:.08,roughness:.78,transparent:true,opacity:.98,side:THREE.DoubleSide});
seaMat.onBeforeCompile=(shader)=>{
 shader.uniforms.uWaveTime={value:0};seaMat.userData.waveShader=shader;
 shader.vertexShader=shader.vertexShader.replace('#include <common>',`#include <common>
 uniform float uWaveTime;
 varying vec2 vSeaUV;
 varying float vWaveCrest;`);
 shader.vertexShader=shader.vertexShader.replace('#include <begin_vertex>',`#include <begin_vertex>
 vSeaUV=position.xz;
 float w1=sin(position.x*6.3+position.z*2.1+uWaveTime*1.45);
 float w2=sin(position.x*-3.4+position.z*8.1-uWaveTime*1.85);
 float w3=sin(position.x*13.7-position.z*10.8+uWaveTime*2.55);
 float w4=sin(position.x*22.5+position.z*17.1-uWaveTime*3.2);
 transformed.y+=.034*w1+.023*w2+.009*w3+.004*w4;
 vWaveCrest=.43*w1+.30*w2+.18*w3+.09*w4;`);
 shader.vertexShader=shader.vertexShader.replace('#include <beginnormal_vertex>',`#include <beginnormal_vertex>
 float dx=.034*6.3*cos(position.x*6.3+position.z*2.1+uWaveTime*1.45)
 +.023*(-3.4)*cos(position.x*-3.4+position.z*8.1-uWaveTime*1.85)
 +.009*13.7*cos(position.x*13.7-position.z*10.8+uWaveTime*2.55);
 float dz=.034*2.1*cos(position.x*6.3+position.z*2.1+uWaveTime*1.45)
 +.023*8.1*cos(position.x*-3.4+position.z*8.1-uWaveTime*1.85)
 -.009*10.8*cos(position.x*13.7-position.z*10.8+uWaveTime*2.55);
 objectNormal=normalize(vec3(-dx,1.0,-dz));`);
 shader.fragmentShader=shader.fragmentShader.replace('#include <common>',`#include <common>
 uniform float uWaveTime;
 varying vec2 vSeaUV;
 varying float vWaveCrest;`);
 shader.fragmentShader=shader.fragmentShader.replace('#include <color_fragment>',`#include <color_fragment>
 // 실제 울돌목 바다 이미지 질감을 보존하면서 파도의 능선에만 약한 포말을 더한다.
 float rip1=sin(vSeaUV.x*33.7+vSeaUV.y*21.9+uWaveTime*2.3);
 float rip2=sin(vSeaUV.x*-41.1+vSeaUV.y*35.3-uWaveTime*3.1);
 float foam=smoothstep(.63,.96,vWaveCrest+.035*rip1+.028*rip2);
 diffuseColor.rgb=mix(diffuseColor.rgb,vec3(.79,.90,.91),foam*.20);
 diffuseColor.rgb*=.96+.045*sin(uWaveTime*.48+vSeaUV.x*2.1+vSeaUV.y*1.7);`);
};

const sea=new THREE.Mesh(seaGeo,seaMat);world.add(sea);
const fleet=new THREE.Group();world.add(fleet);const vessels=[];let sourceShip=null,sourceAdmiral=null,act=0,started=false,start=0,mode='normal',chief=null,chiefActor=null;
function log(t){$('diagnostics').textContent+=t+'\n';console.log('[이순신XR]',t)}
function load(url){return new Promise((resolve,reject)=>new GLTFLoader().load(url,g=>resolve(g.scene),undefined,reject))}
// 핵심: GLB 내부 루트의 기존 위치/회전/스케일을 변경하지 않는다.
// THREE.Box3로 측정한 원본을 단 하나의 외부 pivot 그룹에서 정규화한다.
function makeShip(){
  // admiral-yi-battle-xr 원본 489~494행의 정규화 순서를 그대로 따른다.
  // 원본 GLB를 root에 넣고, 원본과 동일하게 k와 중심점 보정을 적용한다.
  const ship=sourceShip.clone(true), root=new THREE.Group();root.add(ship);
  ship.updateMatrixWorld(true);
  let b=new THREE.Box3().setFromObject(ship);
  const size=b.getSize(new THREE.Vector3()),center=b.getCenter(new THREE.Vector3());
  const k=1.45/Math.max(size.x,size.y,size.z);
  ship.scale.multiplyScalar(k);
  ship.position.sub(center.multiplyScalar(k));
  ship.updateMatrixWorld(true);
  b=new THREE.Box3().setFromObject(ship);
  // 원본 boatRoot.scale=.65 에서 12척 함대용 .27로만 축소
  const fleetScale=.27;
  root.scale.setScalar(fleetScale);
  root.position.y=(-b.min.y-.045)*fleetScale;
  root.userData.normalizedBox=b.clone();
  root.updateMatrixWorld(true);
  const finalSize=new THREE.Box3().setFromObject(root).getSize(new THREE.Vector3());
  log('판옥선 크기 '+finalSize.toArray().map(v=>v.toFixed(3)).join(' × '));
  return root;
}
function addActor(ship){if(!sourceAdmiral)return;const actor=sourceAdmiral.clone(true);const b=new THREE.Box3().setFromObject(actor),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());const p=new THREE.Group();p.add(actor);actor.position.sub(c);p.scale.setScalar(.15/Math.max(s.y,.0001));ship.add(p); // 배 정규화 그룹의 바깥쪽, 선박의 크기와 독립적으로 인물 배치
p.position.set(0,chief.userData.normalizedBox.max.y*.78,0);p.rotation.y=Math.PI;chiefActor=p;return p}
function fleetLayout(count,forward=false){
  fleet.clear();vessels.length=0;chief=null;chiefActor=null;
  // 바다 8×8 위 3열×4행. 모든 선박은 서로 다른 월드 좌표를 가진다.
  for(let i=0;i<count;i++){
    const ship=makeShip();
    const col=i%3,row=Math.floor(i/3);
    ship.position.x=(col-1)*1.12;
    ship.position.z=-2.35+row*.93;
    if(forward){if(i===0){ship.position.x=0;ship.position.z=1.48;}
      else {const j=i-1;ship.position.x=((j%3)-1)*1.12;ship.position.z=-2.45+Math.floor(j/3)*.85;}}
    fleet.add(ship);vessels.push(ship);if(i===0)chief=ship;
  }
  if(chief&&(act===1||act===2))addActor(chief);
  log('배 '+vessels.length+'척; 좌표 '+vessels.map(v=>`(${v.position.x.toFixed(2)},${v.position.z.toFixed(2)})`).join(' '));
}
function setCamera(){camera.position.set(0,3.8,7.7);orbit.target.set(0,0,-.6);if(act===2){camera.position.set(0,1.6,3.4);orbit.target.set(0,.15,.3)}if(act===3){camera.position.set(0,2.7,5.4);orbit.target.set(0,0,-1)}orbit.update()}
function updateCount(n){$('counter').style.display=act===0?'':'none';$('counter').textContent='판옥선 '+n+' / 12척'}
function setAct(n){act=n;started=false;mode='normal';document.querySelectorAll('#nav button').forEach((b,i)=>b.classList.toggle('active',i===n));const d=lessons[n];['sceneTitle','hanja','reading','meaning','explain','question'].forEach((id,i)=>$(id).textContent=d[i]);$('choices').replaceChildren();d[6].forEach((answer,i)=>{const b=document.createElement('button');b.textContent=answer;b.onclick=()=>$('result').textContent=i===d[7]?'정답입니다!':'다시 생각해 보세요.';$('choices').appendChild(b)});$('result').textContent='';fleet.clear();vessels.length=0;updateCount(0);$('subtitle').textContent='▶ 체험 시작을 누르세요.';setCamera();}
function begin(count=12,diagnostic=false){if(!sourceShip){$('status').textContent='판옥선 GLB 로딩 중입니다.';return}started=true;start=performance.now()/1000;mode=diagnostic?'diagnostic':'normal';if(act===3){fleet.clear();vessels.length=0;updateCount(0);$('subtitle').textContent='울돌목의 좁은 물길과 거센 조류';return}if(diagnostic){fleetLayout(count);updateCount(count);$('subtitle').textContent=count+'척 실제 모델 생성 · 마우스로 회전하여 확인';return}if(act===0){fleetLayout(1);updateCount(1);$('subtitle').textContent='한 척에서 열두 척으로, 희망의 함대';}else{fleetLayout(act===1?12:act===2?1:12,act===1);updateCount(0);$('subtitle').textContent=act===1?'대장선이 앞장서고 열한 척이 뒤따릅니다.':act===2?'이순신 장군의 결의':'명량의 승리';}}
for(let i=0;i<5;i++){const b=document.createElement('button');b.textContent=(i+1)+'막';b.onclick=()=>setAct(i);$('nav').appendChild(b)}$('play').onclick=()=>begin();$('reset').onclick=()=>setAct(act);$('prev').onclick=()=>setAct((act+4)%5);$('next').onclick=()=>setAct((act+1)%5);$('test1').onclick=()=>begin(1,true);$('test3').onclick=()=>begin(3,true);$('test12').onclick=()=>begin(12,true);$('speak').onclick=()=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(lessons[act][2]+' . '+lessons[act][3]);u.lang='ko-KR';speechSynthesis.speak(u)};
Promise.all([load(base+'Sketchfab_panokseon.glb'),load(base+'admiral-yi-sunsin.glb')]).then(([s,a])=>{sourceShip=s;sourceAdmiral=a;$('status').textContent='판옥선·장군 GLB 로딩 완료. 진단 1척 → 3척 → 12척 순서로 확인할 수 있습니다.';log('두 GLB 로드 완료');}).catch(e=>{$('status').textContent='모델 로딩 오류: '+e.message;log(e.stack||String(e))});
function resize(){const el=$('view');const w=el.clientWidth,h=el.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();setAct(0);
renderer.setAnimationLoop(t=>{const sec=t/1000;if(seaMat.userData.waveShader)seaMat.userData.waveShader.uniforms.uWaveTime.value=sec;if(started&&act===0&&mode==='normal'&&vessels.length<12){const target=Math.min(12,1+Math.floor((sec-start)/.65));if(target>vessels.length){fleetLayout(target);updateCount(target)}}for(let i=0;i<vessels.length;i++){const sh=vessels[i];sh.rotation.z=.015*Math.sin(sec*1.5+i);sh.rotation.x=.012*Math.cos(sec*1.1+i);sh.position.y=.012*Math.sin(sec*1.8+i)}orbit.update();renderer.render(scene,camera)});
</script></body></html>
