<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이순신 한자학습 XR — 3D 판옥선 12척</title><style>
*{box-sizing:border-box}body{margin:0;background:#071725;color:#f4f0e6;font-family:system-ui,'Malgun Gothic',sans-serif}header,footer{text-align:center;padding:18px}h1{color:#f3ce85;margin:0;font-size:clamp(25px,4vw,40px)}header p,footer{color:#b9c9d2}.wrap{max-width:1150px;margin:auto;padding:10px}.nav,.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}button{background:#21485f;border:1px solid #7c9bab;color:#fff;border-radius:9px;padding:11px 15px;cursor:pointer;font-size:15px}button.active,button.primary{background:#94672e;border-color:#e2bb7b}.viewer{height:min(60vw,570px);min-height:350px;position:relative;background:#102e46;border:2px solid #a58d61;border-radius:15px;overflow:hidden}#three{width:100%;height:100%;display:block}.overlay{position:absolute;inset:0;pointer-events:none}.subtitle{position:absolute;bottom:12px;left:4%;right:4%;padding:10px;background:#061723c9;text-align:center;border-radius:8px;font-weight:bold}.counter{position:absolute;top:12px;left:12px;background:#051b2ac9;border-radius:7px;padding:8px}.lesson{padding:20px;text-align:center;background:#112d40;border-radius:12px}.hanja{font-size:clamp(30px,6vw,52px);font-family:serif;color:#f3ce85;margin:8px}.reading{font-size:20px}.meaning{font-size:18px;margin:10px}.explain{color:#b9c9d2}.quiz{padding:15px;border:1px solid #456277;border-radius:10px;margin-top:12px}.quiz button{margin:3px}.status{color:#f3ce85}.notice{font-size:13px;color:#c5d5dd;text-align:center;margin:8px}.shake{animation:shake .24s 3}@keyframes shake{25%{transform:translate(3px,2px)}50%{transform:translate(-3px,-2px)}75%{transform:translate(2px,-2px)}}@media(max-width:600px){.viewer{min-height:390px}}
</style></head><body><header><h1>⚓ 이순신 한자학습 XR</h1><p>3D 판옥선 열두 척 · 울돌목 바다 · 다섯 막의 한문 체험</p></header><main class="wrap"><nav class="nav" id="nav"></nav><div class="viewer" id="viewer"><canvas id="three"></canvas><div class="overlay"><div class="counter" id="counter">판옥선 0 / 12척</div><div class="subtitle" id="subtitle">체험 시작을 누르세요.</div></div></div><div class="controls"><button class="primary" id="play">▶ 체험 시작</button><button id="speak">🔊 음성 듣기</button><button id="reset">↺ 장면 초기화</button><button id="prev">← 이전 막</button><button id="next">다음 막 →</button></div><p class="notice" id="loadStatus">3D 판옥선 모델과 울돌목 바다 질감을 불러오는 중입니다. 마우스로 회전·확대할 수 있습니다.</p><section class="lesson"><div id="sceneTitle"></div><div class="hanja" id="hanja"></div><div class="reading" id="reading"></div><div class="meaning" id="meaning"></div><div class="explain" id="explain"></div></section><section class="quiz"><b>한자 확인 문제</b><p id="question"></p><div id="choices"></div><p class="status" id="result"></p></section></main><footer>교육용 3D 시뮬레이션 · 실제 역사적 함대 배치 및 조류의 정밀 복원은 아닙니다.</footer>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/loaders/GLTFLoader.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/controls/OrbitControls.js';
const MODEL='https://imm-content.github.io/admiral-yi-history-xr/Sketchfab_panokseon.glb';
const SEA='https://raw.githubusercontent.com/imm-content/admiral-yi-battle-xr/main/uldolmok-sea-texture.png';
const scenes=[
['제1막 · 희망의 열두 척','今臣戰船 尙有十二','금신전선 상유십이','지금 신에게는 아직 전선 열두 척이 있습니다.','今(이제 금) · 臣(신하 신) · 戰(싸울 전) · 船(배 선) · 尙(오히려 상) · 有(있을 유) · 十(열 십) · 二(두 이)','「十二」의 뜻은?',['열둘','스물','둘'],0],
['제2막 · 죽을힘을 다하여','出死力 拒戰則猶可爲也','출사력 거전즉유가위야','죽을힘을 다해 막아 싸운다면 아직 해볼 만합니다.','出(낼 출) · 死(죽을 사) · 力(힘 력) · 拒(막을 거) · 戰(싸울 전) · 則(곧 즉) · 猶(오히려 유) · 可(가할 가) · 爲(할 위) · 也(어조사 야)','「死力」의 뜻은?',['죽을힘','물살','군함'],0],
['제3막 · 필사즉생','必死則生 必生則死','필사즉생 필생즉사','죽기를 각오하면 살고, 살려고만 하면 죽는다.','必(반드시 필) · 死(죽을 사) · 則(곧 즉) · 生(살 생)','「生」의 뜻은?',['싸우다','살다','바다'],1],
['제4막 · 울돌목의 좁은 해협','一夫當逕 足懼千夫','일부당경 족구천부','한 사람이 좁은 길목을 지키면 천 사람도 두렵게 할 수 있다.','一(한 일) · 夫(사내 부) · 當(당할 당) · 逕(좁은 길 경) · 足(족할 족) · 懼(두려워할 구) · 千(일천 천)','「千夫」의 뜻은?',['백 사람','천 사람','열 사람'],1],
['제5막 · 승리의 명량','鳴梁海戰','명량해전','명량에서 벌어진 해전','鳴(울 명) · 梁(들보 량) · 海(바다 해) · 戰(싸울 전)','「海戰」의 뜻은?',['바다의 전투','산의 전투','배 건조'],0]];
const $=id=>document.getElementById(id);let current=0,token=0,model=null,shipCount=0;const ships=[];
const renderer=new THREE.WebGLRenderer({canvas:$('three'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color('#789eb0');scene.fog=new THREE.Fog('#789eb0',85,240);
const camera=new THREE.PerspectiveCamera(46,1,.1,500);camera.position.set(0,37,76);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI/2.05;controls.minDistance=18;controls.maxDistance=145;
scene.add(new THREE.HemisphereLight(0xcdefff,0x243a38,2.3));const sun=new THREE.DirectionalLight(0xfff3d3,2.6);sun.position.set(-30,70,40);scene.add(sun);
const waterGeo=new THREE.PlaneGeometry(280,280,80,80);waterGeo.rotateX(-Math.PI/2);const waterMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.62,metalness:.08,side:THREE.DoubleSide});const water=new THREE.Mesh(waterGeo,waterMat);water.position.y=-.7;scene.add(water);
new THREE.TextureLoader().load(SEA,t=>{t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2.5,2.5);waterMat.map=t;waterMat.needsUpdate=true;},undefined,()=>{$('loadStatus').textContent='바다 이미지 로드 실패: 원본 저장소의 파일 경로를 확인하세요.'});
const terrain=new THREE.Group();scene.add(terrain);function shore(side){const shape=new THREE.Shape();const s=side;[[s*14,-90],[s*100,-90],[s*100,90],[s*14,90],[s*26,48],[s*17,18],[s*22,-12],[s*13,-42]].forEach(([x,y],i)=>i?shape.lineTo(x,y):shape.moveTo(x,y));shape.closePath();const g=new THREE.ExtrudeGeometry(shape,{depth:9,bevelEnabled:true,bevelThickness:2,bevelSize:1,bevelSegments:1});g.rotateX(-Math.PI/2);const mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x405444,roughness:1}));mesh.position.y=-1;terrain.add(mesh)}shore(-1);shore(1);terrain.visible=false;
function fallback(){const g=new THREE.Group();const hull=new THREE.Mesh(new THREE.BoxGeometry(2.6,.75,6.5),new THREE.MeshStandardMaterial({color:0x704626}));g.add(hull);const deck=new THREE.Mesh(new THREE.BoxGeometry(3.5,.65,3.7),new THREE.MeshStandardMaterial({color:0x9d7040}));deck.position.y=.85;g.add(deck);const mast=new THREE.Mesh(new THREE.CylinderGeometry(.09,.12,5),new THREE.MeshStandardMaterial({color:0x4c3020}));mast.position.y=3;g.add(mast);const sail=new THREE.Mesh(new THREE.PlaneGeometry(3,3),new THREE.MeshStandardMaterial({color:0xe7dcc0,side:THREE.DoubleSide}));sail.position.y=3.2;sail.rotation.y=.18;g.add(sail);return g}
new GLTFLoader().load(MODEL,gltf=>{model=gltf.scene;const box=new THREE.Box3().setFromObject(model);const size=box.getSize(new THREE.Vector3());const center=box.getCenter(new THREE.Vector3());const max=Math.max(size.x,size.y,size.z);if(max>0){model.position.sub(center);model.scale.setScalar(7.5/max)}$('loadStatus').textContent='실제 판옥선 GLB 로드 완료 · 마우스/손가락으로 시점을 변경하세요.';},undefined,err=>{$('loadStatus').textContent='GLB 로드 실패: 임시 선박 모델을 표시합니다. GLB 파일의 공개 여부·CORS·용량을 확인하세요.';console.error(err)});
const positions=Array.from({length:12},(_,i)=>{const row=Math.floor(i/3),col=i%3;return [(col-1)*9+(row%2)*2,(-row*12)+20]});
function clearShips(){ships.forEach(s=>scene.remove(s));ships.length=0;shipCount=0;$('counter').textContent='판옥선 0 / 12척'}
function addShip(i){const anchor=new THREE.Group();const boat=(model||fallback()).clone(true);anchor.add(boat);anchor.position.set(positions[i][0],0,positions[i][1]);anchor.userData.phase=i*.65;scene.add(anchor);ships.push(anchor);shipCount++;$('counter').textContent=`판옥선 ${shipCount} / 12척`}
function render(){token++;clearShips();terrain.visible=current===3;const s=scenes[current];$('sceneTitle').textContent=s[0];$('hanja').textContent=s[1];$('reading').textContent=s[2];$('meaning').textContent=s[3];$('explain').textContent=s[4];$('question').textContent=s[5];$('subtitle').textContent='▶ 체험 시작을 누르세요.';$('result').textContent='';$('choices').replaceChildren();s[6].forEach((v,i)=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>$('result').textContent=i===s[7]?'정답입니다!':'다시 생각해 보세요.';$('choices').append(b)});$('nav').replaceChildren();scenes.forEach((v,i)=>{const b=document.createElement('button');b.textContent=`${i+1}막`;if(i===current)b.classList.add('active');b.onclick=()=>{current=i;render()};$('nav').append(b)});camera.position.set(0,current===3?49:37,current===3?80:76);controls.target.set(0,0,0);controls.update()}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function play(){const t=++token;clearShips();const s=scenes[current];$('subtitle').textContent=s[3];const delay=current===0?430:current===3?520:180;for(let i=0;i<12;i++){if(t!==token)return;addShip(i);if(i===0&&current===0){$('subtitle').textContent='첫 번째 판옥선이 나타났습니다. 이제 열두 척이 모입니다.';await sleep(1100)}await sleep(delay)}if(t!==token)return;$('subtitle').textContent=current===3?'울돌목의 좁은 해협과 거센 물살을 이용한 방어를 살펴보세요.':current===0?'판옥선 12척! 함대 전체를 확인하세요.':s[3];if(current===1||current===3){$('viewer').classList.remove('shake');void $('viewer').offsetWidth;$('viewer').classList.add('shake');navigator.vibrate?.([90,60,90])}}
function speak(){if(!('speechSynthesis'in window))return alert('음성 읽기를 지원하지 않는 브라우저입니다.');speechSynthesis.cancel();const s=scenes[current];const u=new SpeechSynthesisUtterance(s[2]+'. '+s[3]);u.lang='ko-KR';u.rate=.85;speechSynthesis.speak(u)}
$('play').onclick=play;$('speak').onclick=speak;$('reset').onclick=render;$('prev').onclick=()=>{current=(current+4)%5;render()};$('next').onclick=()=>{current=(current+1)%5;render()};
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const t=clock.getElapsedTime();ships.forEach(a=>{a.position.y=Math.sin(t*1.8+a.userData.phase)*.14;a.rotation.z=Math.sin(t*1.2+a.userData.phase)*.025});if(waterMat.map){waterMat.map.offset.x=t*.002;waterMat.map.offset.y=t*.004}controls.update();const r=$('viewer').getBoundingClientRect();const w=Math.max(1,Math.round(r.width)),h=Math.max(1,Math.round(r.height));if(renderer.domElement.width!==Math.round(w*renderer.getPixelRatio())||renderer.domElement.height!==Math.round(h*renderer.getPixelRatio())){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}renderer.render(scene,camera)}render();frame();
</script></body></html>
