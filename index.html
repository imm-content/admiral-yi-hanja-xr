<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081c30"><title>이순신 한자학습 XR</title><style>
*{box-sizing:border-box}body{margin:0;background:#071725;color:#f7f2e9;font-family:'Malgun Gothic',system-ui,sans-serif}header{text-align:center;padding:24px 12px 12px}h1{margin:0;color:#f4d393;font-size:clamp(25px,5vw,42px)}header p{color:#d5e4e7;margin:8px}.wrap{max-width:1100px;margin:auto;padding:12px}.stage{height:min(57vw,540px);min-height:290px;position:relative;overflow:hidden;border:2px solid #8b7755;border-radius:16px;background:#14364d url('assets/sea.svg') center/cover}.stage.shake{animation:shake .22s linear 4}@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(5px,3px)}50%{transform:translate(-5px,-2px)}75%{transform:translate(3px,-4px)}}.strait{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1s}.strait.show{opacity:1}.strait:before,.strait:after{content:"";position:absolute;top:-10%;bottom:-10%;width:34%;background:linear-gradient(90deg,#2b332c,#59664a 55%,#252d28);box-shadow:0 0 35px #000b;z-index:2}.strait:before{left:-8%;clip-path:polygon(0 0,100% 0,65% 30%,85% 60%,62% 100%,0 100%)}.strait:after{right:-8%;clip-path:polygon(30% 0,100% 0,100% 100%,25% 100%,10% 62%,32% 32%)}.current{position:absolute;left:33%;width:34%;height:100%;background:repeating-linear-gradient(170deg,transparent 0 27px,#c8e9ee55 29px 34px,transparent 37px 65px);animation:flow 1.7s linear infinite;z-index:1}@keyframes flow{to{background-position:0 110px}}.enemy{position:absolute;z-index:3;left:46%;top:13%;font-size:clamp(28px,5vw,52px);filter:drop-shadow(0 3px 3px #000);animation:enemyMove 5s ease-in-out infinite alternate}@keyframes enemyMove{to{transform:translate(10px,90px)}}.fleet{position:absolute;inset:0;pointer-events:none}.ship{position:absolute;width:clamp(75px,14%,160px);filter:drop-shadow(0 6px 6px #0008);transform:translate(-50%,-50%) scale(.2);opacity:0;transition:transform 1.5s ease,opacity 1.2s ease}.ship.show{transform:translate(-50%,-50%) scale(1);opacity:1;animation:bob 3s ease-in-out infinite alternate}@keyframes bob{to{translate:0 7px}}.admiral{position:absolute;height:83%;bottom:-5%;right:4%;filter:drop-shadow(0 8px 14px #0009);opacity:0;transform:translateX(80px);transition:all 1s}.admiral.show{opacity:1;transform:none}.overlay{position:absolute;inset:0;background:radial-gradient(circle at center,#f5cc83aa,transparent 65%);opacity:0;pointer-events:none}.overlay.flash{animation:flash .8s 2}@keyframes flash{40%{opacity:.9}}.subtitle{position:absolute;bottom:15px;left:4%;right:4%;padding:12px;background:#041320c9;border-radius:10px;text-align:center;font-size:clamp(14px,2.5vw,22px);font-weight:700}.toolbar,.nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0}button{border:1px solid #b9a77d;background:#183d53;color:white;border-radius:9px;padding:11px 15px;font-size:15px;cursor:pointer}button:hover,button:focus{background:#2d627c}button.active,.primary{background:#9d7337;color:white}.lesson{background:#112b3d;border:1px solid #476477;border-radius:14px;padding:20px;text-align:center}.hanja{font-family:serif;font-size:clamp(29px,6vw,55px);color:#f5d18b;margin:8px 0}.reading{font-size:20px;color:#d5e9f1}.meaning{font-size:19px;margin:10px}.hint{color:#c4d2da;font-size:14px}.quiz{margin-top:15px;padding:15px;border:1px solid #466577;border-radius:12px;background:#10283b}.quiz button{margin:4px}.status{min-height:24px;color:#f5d18b}footer{text-align:center;color:#9db4c3;font-size:12px;padding:24px}.hide{display:none}@media(max-width:600px){.admiral{height:70%}.ship{width:19%}.stage{min-height:330px}}
</style></head><body><header><h1>⚓ 이순신 한자학습 XR</h1><p>열두 척의 기적, 한문으로 만나다 · 체험형 학습관</p></header><main class="wrap"><nav class="nav" id="nav"></nav><section class="stage" id="stage" aria-label="명량해전 체험 애니메이션"><div class="strait" id="strait"><div class="current"></div><div class="enemy">⛵ ⛵ ⛵</div></div><div class="fleet" id="fleet"></div><img id="admiral" class="admiral" src="assets/admiral.svg" alt="이순신 장군 상징 삽화"><div class="overlay" id="overlay"></div><div class="subtitle" id="subtitle" aria-live="polite">장면을 선택하고 체험 시작을 눌러 주세요.</div></section><div class="toolbar"><button class="primary" id="play">▶ 체험 시작</button><button id="speak">🔊 한문·뜻 읽기</button><button id="record">🎬 영상 녹화</button><button id="stopRecord" class="hide">■ 녹화 종료</button><button id="prev">← 이전</button><button id="next">다음 →</button></div><section class="lesson"><div class="hint" id="sceneTitle"></div><div class="hanja" id="hanja"></div><div class="reading" id="reading"></div><div class="meaning" id="meaning"></div><div class="hint" id="explain"></div></section><section class="quiz"><strong>한자 확인 문제</strong><p id="question"></p><div id="choices"></div><p class="status" id="result" aria-live="polite"></p></section></main><footer>교육용 창작 애니메이션 · 실제 4DX 장비 및 AR 카메라 추적 기능은 포함되지 않습니다.</footer><script>
'use strict';const scenes=[{title:'제1막 · 희망의 열두 척',hanja:'今臣戰船 尙有十二',reading:'금신전선 상유십이',meaning:'지금 신에게는 아직 전선 열두 척이 있습니다.',explain:'今(이제 금) · 臣(신하 신) · 戰(싸울 전) · 船(배 선) · 尙(오히려 상) · 有(있을 유) · 十(열 십) · 二(두 이)',question:'「十二」의 뜻은 무엇일까요?',choices:['열두','스물','두 척'],answer:0},{title:'제2막 · 죽을힘을 다하여',hanja:'出死力 拒戰則猶可爲也',reading:'출사력 거전즉유가위야',meaning:'죽을힘을 다해 막아 싸운다면 아직 해볼 만합니다.',explain:'出(낼 출) · 死(죽을 사) · 力(힘 력) · 拒(막을 거) · 戰(싸울 전) · 則(곧 즉) · 猶(오히려 유) · 可(가할 가) · 爲(할 위) · 也(어조사 야)',question:'「死力」이 뜻하는 것은?',choices:['물의 흐름','죽을힘','군함'],answer:1},{title:'제3막 · 필사즉생',hanja:'必死則生 必生則死',reading:'필사즉생 필생즉사',meaning:'죽기를 각오하면 살고, 살려고만 하면 죽는다.',explain:'必(반드시 필) · 死(죽을 사) · 則(곧 즉) · 生(날 생)',question:'「生」의 뜻은?',choices:['싸우다','바다','살다'],answer:2},{title:'제4막 · 울돌목의 좁은 해협',hanja:'一夫當逕 足懼千夫',reading:'일부당경 족구천부',meaning:'한 사람이 좁은 길목을 지키면 천 사람도 두렵게 할 수 있다.',explain:'一(한 일) · 夫(사내 부) · 當(당할 당) · 逕(좁은 길 경) · 足(족할 족) · 懼(두려워할 구) · 千(일천 천). 울돌목의 좁은 물길과 거센 조류를 이용한 전술을 생각해 보세요.',question:'「千夫」는 몇 사람을 뜻할까요?',choices:['열 사람','백 사람','천 사람'],answer:2},{title:'제5막 · 승리의 명량',hanja:'鳴梁海戰',reading:'명량해전',meaning:'명량에서 벌어진 해전',explain:'鳴(울 명) · 梁(들보 량) · 海(바다 해) · 戰(싸울 전) · 학습한 명구를 다시 읽어 보세요.',question:'「海戰」의 뜻은?',choices:['바다에서 벌이는 전투','산에서 벌이는 전투','배를 만드는 일'],answer:0}];
const $=id=>document.getElementById(id);let current=0,runToken=0,recorder=null,recordChunks=[];const positions=[[49,70],[31,64],[66,64],[18,75],[81,75],[39,52],[58,52],[12,56],[89,55],[25,43],[75,43],[50,38]];const sleep=ms=>new Promise(r=>setTimeout(r,ms));function render(){runToken++;const s=scenes[current];$('sceneTitle').textContent=s.title;$('hanja').textContent=s.hanja;$('reading').textContent=s.reading;$('meaning').textContent=s.meaning;$('explain').textContent=s.explain;$('question').textContent=s.question;$('result').textContent='';$('subtitle').textContent='▶ 체험 시작을 눌러 장면을 감상하세요.';$('fleet').replaceChildren();$('strait').classList.remove('show');$('admiral').classList.remove('show');$('stage').classList.remove('shake');$('overlay').classList.remove('flash');$('choices').replaceChildren();s.choices.forEach((choice,i)=>{let b=document.createElement('button');b.textContent=choice;b.onclick=()=>{$('result').textContent=i===s.answer?'정답입니다! 한자의 뜻을 기억해 보세요.':'다시 생각해 보세요.'};$('choices').append(b)});$('nav').replaceChildren();scenes.forEach((x,i)=>{let b=document.createElement('button');b.textContent=`${i+1}막`;if(i===current)b.classList.add('active');b.onclick=()=>{current=i;render()};$('nav').append(b)})}function addShip(i){const im=document.createElement('img');im.src='assets/panokseon.svg';im.alt='판옥선';im.className='ship';im.style.left=positions[i][0]+'%';im.style.top=positions[i][1]+'%';im.style.zIndex=String(Math.round(positions[i][1]));$('fleet').append(im);requestAnimationFrame(()=>im.classList.add('show'))}function shake(){let el=$('stage');el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');if(navigator.vibrate)navigator.vibrate([80,60,80])}function flash(){let el=$('overlay');el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}async function play(){let token=++runToken;const s=scenes[current];$('fleet').replaceChildren();$('strait').classList.remove('show');$('admiral').classList.remove('show');$('subtitle').textContent=s.meaning;if(current===0){addShip(0);await sleep(1400);for(let i=1;i<12;i++){if(token!==runToken)return;addShip(i);await sleep(270)}$('subtitle').textContent='한 척에서 열두 척으로! 조선 수군의 희망을 확인하세요.'}else if(current===1){for(let i=0;i<12;i++){if(token!==runToken)return;addShip(i);await sleep(110)}shake();flash();$('subtitle').textContent='죽을힘을 다해 싸우는 조선 수군!'}else if(current===2){$('admiral').classList.add('show');await sleep(650);if(token!==runToken)return;flash();shake();$('subtitle').textContent='必死則生 必生則死 — 결의를 한자로 새겨 봅니다.'}else if(current===3){$('strait').classList.add('show');await sleep(750);if(token!==runToken)return;addShip(0);shake();$('subtitle').textContent='울돌목: 좁은 물길과 거센 물살이 적의 대군을 막아냅니다.'}else{for(let i=0;i<12;i++){if(token!==runToken)return;addShip(i);await sleep(100)}$('admiral').classList.add('show');$('subtitle').textContent='명량해전의 의미를 되새기며 학습을 마칩니다.'}}function speak(){if(!('speechSynthesis'in window)){alert('이 브라우저는 음성 읽기를 지원하지 않습니다.');return}speechSynthesis.cancel();const s=scenes[current];const u=new SpeechSynthesisUtterance(s.reading+'. '+s.meaning);u.lang='ko-KR';u.rate=.82;speechSynthesis.speak(u)}
// Record a composited canvas, including the moving ships, as a silent WebM video.
let canvasTimer=null;function startRecording(){if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){alert('이 브라우저는 영상 녹화를 지원하지 않습니다. PC Chrome/Edge를 권장합니다.');return}const canvas=document.createElement('canvas');canvas.width=1280;canvas.height=720;const ctx=canvas.getContext('2d');const sea=new Image(),ship=new Image(),adm=new Image();sea.src='assets/sea.svg';ship.src='assets/panokseon.svg';adm.src='assets/admiral.svg';let t=0;function draw(){ctx.fillStyle='#102e46';ctx.fillRect(0,0,1280,720);if(sea.complete&&sea.naturalWidth)ctx.drawImage(sea,0,0,1280,720);const ships=[...$('fleet').children];ships.forEach(el=>{if(!ship.complete||!ship.naturalWidth)return;let x=parseFloat(el.style.left)/100*1280,y=parseFloat(el.style.top)/100*720;ctx.drawImage(ship,x-95,y-75+Math.sin(t/12)*5,190,140)});if($('admiral').classList.contains('show')&&adm.complete&&adm.naturalWidth)ctx.drawImage(adm,840,110,350,530);if($('strait').classList.contains('show')){ctx.fillStyle='#48563e';ctx.fillRect(0,0,370,720);ctx.fillRect(910,0,370,720);ctx.fillStyle='#b5e5f1aa';for(let k=0;k<10;k++){ctx.fillRect(480+(k%3)*110,(k*90+t*4)%720,90,5)}}ctx.fillStyle='#071a2bdc';ctx.fillRect(0,610,1280,110);ctx.fillStyle='#f4d393';ctx.font='bold 40px serif';ctx.textAlign='center';ctx.fillText(scenes[current].hanja,640,659);ctx.fillStyle='white';ctx.font='25px sans-serif';ctx.fillText(scenes[current].meaning,640,696);t++}draw();canvasTimer=setInterval(draw,1000/30);let stream=canvas.captureStream(30);let mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';try{recorder=new MediaRecorder(stream,{mimeType:mime})}catch(e){clearInterval(canvasTimer);alert('녹화를 시작할 수 없습니다: '+e.message);return}recordChunks=[];recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};recorder.onstop=()=>{clearInterval(canvasTimer);stream.getTracks().forEach(x=>x.stop());const blob=new Blob(recordChunks,{type:'video/webm'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='admiral-yi-hanja-xr-scene'+(current+1)+'.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);$('record').classList.remove('hide');$('stopRecord').classList.add('hide')};recorder.start();$('record').classList.add('hide');$('stopRecord').classList.remove('hide');play()}
$('play').onclick=play;$('speak').onclick=speak;$('prev').onclick=()=>{current=(current+4)%5;render()};$('next').onclick=()=>{current=(current+1)%5;render()};$('record').onclick=startRecording;$('stopRecord').onclick=()=>{if(recorder&&recorder.state==='recording')recorder.stop()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});render();
</script></body></html>
